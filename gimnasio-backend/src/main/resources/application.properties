spring.application.name=gimnasio-backend
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GimnasioDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=gimnasio_app
spring.datasource.password=Gimnasio2026!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5500}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.security.cookie-secure=${COOKIE_SECURE:false}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
