<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><select id="cliente" class="solo-staff" onchange="cargar()"></select><button class="btn solo-admin" onclick="abrir()">+ Nueva notificación</button></div><div class="tabla"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Notificación</th><th>Estado</th><th></th></tr></thead><tbody id="filas"><tr><td colspan="5" class="vacio">Cargando...</td></tr></tbody></table></div><dialog id="dlg"><form id="f" class="cuerpo"><h3>Nueva notificación</h3>
<label>Cliente<select name="clienteId" required></select></label>
<label>Título<input name="titulo" required maxlength="150"></label>
<label>Mensaje<input name="mensaje" required maxlength="500"></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/notificaciones.js"></script></body></html>
