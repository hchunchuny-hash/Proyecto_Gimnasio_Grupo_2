<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horarios - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><select id="clase" onchange="pintar()"></select><button class="btn solo-admin" onclick="abrir()">+ Nuevo horario</button></div><div class="tabla"><table><thead><tr><th>Fecha</th><th>Horario</th><th>Clase</th><th>Entrenador</th></tr></thead><tbody id="filas"><tr><td colspan="4" class="vacio">Cargando...</td></tr></tbody></table></div><dialog id="dlg"><form id="f" class="cuerpo"><h3>Nuevo horario</h3>
<label>Clase<select name="claseId" required></select></label>
<label>Entrenador<select name="entrenadorId" required></select></label>
<label>Fecha<input name="fecha" type="date" required></label>
<label>Hora de inicio<input name="horaInicio" type="time" required></label>
<label>Hora de fin<input name="horaFin" type="time" required></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/horarios.js"></script></body></html>
