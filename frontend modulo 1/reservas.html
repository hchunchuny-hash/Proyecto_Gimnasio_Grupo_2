<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservas - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><select id="estado" onchange="pintar()"><option value="">Todos los estados</option><option>PENDIENTE</option><option>CONFIRMADA</option><option>FINALIZADA</option><option>CANCELADA</option></select><button class="btn" onclick="abrir()">+ Nueva reserva</button></div><div class="tabla"><table><thead><tr><th>Fecha</th><th>Horario</th><th>Cliente</th><th>Servicio</th><th>Estado</th><th></th></tr></thead><tbody id="filas"><tr><td colspan="6" class="vacio">Cargando...</td></tr></tbody></table></div><dialog id="dlg"><form id="f" class="cuerpo"><h3>Nueva reserva</h3>
<label>Cliente<select name="clienteId" required></select></label>
<label>Servicio<select name="servicioId" required></select></label>
<label>Fecha<input name="fecha" type="date" required></label>
<label>Hora de inicio<input name="horaInicio" type="time" required></label>
<label>Hora de fin (opcional)<input name="horaFin" type="time"></label>
<label>Observaciones<input name="observaciones" maxlength="250"></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/reservas.js"></script></body></html>
