<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenadores - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><input id="buscar" placeholder="Buscar por nombre o especialidad..." oninput="pintar()"><button class="btn" onclick="abrir(null)">+ Nuevo entrenador</button></div>
<div class="tabla"><table><thead><tr><th>Nombre</th><th>Especialidad</th><th>Teléfono</th><th>ID usuario</th><th>Estado</th><th></th></tr></thead>
<tbody id="filas"><tr><td colspan="6" class="vacio">Cargando...</td></tr></tbody></table></div>
<dialog id="dlg"><form id="f" class="cuerpo"><h3 id="titulo"></h3>
<label>ID de usuario (el que devuelve el registro)<input name="usuarioId" type="number" min="1" required></label>
<label>Nombres<input name="nombres" required maxlength="100"></label>
<label>Apellidos<input name="apellidos" required maxlength="100"></label>
<label>Especialidad<input name="especialidad" maxlength="100"></label>
<label>Teléfono<input name="telefono" maxlength="8" inputmode="numeric" pattern="[0-9]{7,8}" title="7 u 8 dígitos, solo números"></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/entrenadores.js"></script></body></html>
