<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagos - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<section class="panel solo-admin"><h3>Ingresos mensuales</h3><div class="tabla" id="ingresos"></div></section><div class="herram"><input id="buscar" placeholder="Buscar por cliente o factura..." oninput="pintar()"><button class="btn solo-admin" onclick="abrir()">+ Procesar pago</button></div><div class="tabla"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Original</th><th>Descuento</th><th>Pagado</th><th>Método</th><th>Estado</th><th>Factura</th><th></th></tr></thead><tbody id="filas"><tr><td colspan="9" class="vacio">Cargando...</td></tr></tbody></table></div><dialog id="dlg"><form id="f" class="cuerpo"><h3>Procesar pago</h3>
<label>Membresía activa<select name="membresiaId" required></select></label>
<label>Descuento<select name="descuentoId"></select></label>
<label>Método de pago<select name="metodoPago"><option>EFECTIVO</option><option>TARJETA</option><option>TRANSFERENCIA</option></select></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/pagos.js"></script></body></html>
