<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membresías - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><select id="cliente" class="solo-staff" onchange="pintar()"></select>
<select id="estado" onchange="pintar()"><option value="">Todos los estados</option><option value="ACTIVA">Activa</option><option value="VENCIDA">Vencida</option><option value="SUSPENDIDA">Suspendida</option></select>
<button class="btn sec solo-admin" style="margin-left:auto" onclick="actualizarVencidas()">Actualizar vencidas</button><button class="btn solo-admin" style="margin-left:0" onclick="abrir()">+ Asignar membresía</button></div>
<div class="tabla"><table><thead><tr><th>Cliente</th><th>Tipo</th><th>Inicio</th><th>Vencimiento</th><th>Precio</th><th>Estado</th></tr></thead>
<tbody id="filas"><tr><td colspan="6" class="vacio">Cargando...</td></tr></tbody></table></div>
<dialog id="dlg"><form id="f" class="cuerpo"><h3>Asignar membresía</h3>
<label>Cliente<select name="clienteId" required></select></label>
<label>Tipo de membresía<select name="tipoMembresiaId" required></select></label>
<label>Fecha de inicio (si se deja vacía, hoy)<input name="fechaInicio" type="date"></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/membresias.js"></script></body></html>
