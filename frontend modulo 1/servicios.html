<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servicios - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><input id="buscar" placeholder="Buscar servicio..." oninput="pintar()"><button class="btn solo-admin" onclick="abrir()">+ Nuevo servicio</button></div><div class="tabla"><table><thead><tr><th>Servicio</th><th>Descripción</th><th>Precio</th><th>Estado</th><th></th></tr></thead><tbody id="filas"><tr><td colspan="5" class="vacio">Cargando...</td></tr></tbody></table></div><dialog id="dlg"><form id="f" class="cuerpo"><h3>Servicio</h3>
<label>Nombre<input name="nombre" required maxlength="100"></label>
<label>Descripción<input name="descripcion" maxlength="250"></label>
<label>Precio<input name="precio" type="number" step="0.01" min="0" required></label>
<label class="check"><input name="estado" type="checkbox" checked>Servicio activo</label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/servicios.js"></script></body></html>
