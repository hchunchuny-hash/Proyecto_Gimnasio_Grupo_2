<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progreso - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><select id="cliente" class="solo-staff" onchange="cargarProgreso()"></select><button class="btn" onclick="abrir()">+ Registrar medición</button></div>
<div class="tabla"><table><thead><tr><th>Fecha</th><th>Peso (kg)</th><th>Observaciones</th></tr></thead>
<tbody id="filas"><tr><td colspan="3" class="vacio">Elige un cliente para ver su progreso.</td></tr></tbody></table></div>
<dialog id="dlg"><form id="f" class="cuerpo"><h3>Registrar medición</h3>
<div class="solo-staff"><label>Cliente<select name="clienteId" required></select></label></div>
<label>Fecha<input name="fecha" type="date" required></label>
<label>Peso (kg)<input name="peso" type="number" step="0.01" min="0" required></label>
<label>Observaciones<input name="observaciones" maxlength="500"></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/progreso.js"></script></body></html>
