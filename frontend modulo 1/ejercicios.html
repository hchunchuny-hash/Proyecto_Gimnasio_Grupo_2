<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicios - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><input id="buscar" placeholder="Buscar ejercicio..." oninput="pintar()"><button class="btn solo-staff" onclick="abrir()">+ Nuevo ejercicio</button></div>
<div class="tabla"><table><thead><tr><th>Nombre</th><th>Descripción</th><th>Grupo muscular (ID)</th><th>Nivel (ID)</th><th>Equipamiento</th><th>Estado</th></tr></thead>
<tbody id="filas"><tr><td colspan="6" class="vacio">Cargando...</td></tr></tbody></table></div>
<dialog id="dlg"><form id="f" class="cuerpo"><h3>Nuevo ejercicio</h3>
<label>Nombre<input name="nombre" required maxlength="100"></label>
<label>Descripción<input name="descripcion" maxlength="250"></label>
<label>ID del grupo muscular (tabla GrupoMuscular)<input name="grupoMuscularId" type="number" min="1" required></label>
<label>ID del nivel de dificultad (tabla NivelDificultad)<input name="nivelDificultadId" type="number" min="1" required></label>
<label>Equipamiento<select name="equipamientoId"></select></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/ejercicios.js"></script></body></html>
