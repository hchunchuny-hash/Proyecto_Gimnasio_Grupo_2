<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clases - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><input id="buscar" placeholder="Buscar clase o servicio..." oninput="pintar()"><button class="btn solo-admin" onclick="abrir()">+ Nueva clase</button></div><div class="tabla"><table><thead><tr><th>Clase</th><th>Servicio</th><th>Inscritos / cupo</th><th>Estado</th><th></th></tr></thead><tbody id="filas"><tr><td colspan="5" class="vacio">Cargando...</td></tr></tbody></table></div><dialog id="dlg"><form id="f" class="cuerpo"><h3>Nueva clase</h3>
<label>Servicio<select name="servicioId" required></select></label>
<label>Nombre<input name="nombre" required maxlength="100"></label>
<label>Descripción<input name="descripcion" maxlength="250"></label>
<label>Cupo máximo<input name="cupoMaximo" type="number" min="1" required></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
<dialog id="dlgI"><form id="fI" class="cuerpo"><h3>Inscribir cliente</h3><input type="hidden" name="claseId"><label>Cliente<select name="clienteId" required></select></label><div class="acc-form"><button type="button" class="btn sec" onclick="dlgI.close()">Cancelar</button><button class="btn">Inscribir</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/extra.js"></script><script src="js/clases.js"></script></body></html>
