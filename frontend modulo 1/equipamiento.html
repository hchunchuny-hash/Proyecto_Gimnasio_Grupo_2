<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipamiento - GymAdmin</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app"><aside id="menu"></aside><div class="contenido"><header id="topbar"></header><main>
<div class="herram"><input id="buscar" placeholder="Buscar por nombre, serie o área..." oninput="pintar()">
<select id="estado" onchange="pintar()"><option value="">Todos los estados</option><option value="OPERATIVO">Operativo</option><option value="MANTENIMIENTO">Mantenimiento</option><option value="FUERA_DE_SERVICIO">Fuera de servicio</option></select>
<button class="btn solo-admin" onclick="abrir(null)">+ Nuevo equipo</button></div>
<div class="tabla"><table><thead><tr><th>Nombre</th><th>N.° de serie</th><th>Adquisición</th><th>Área</th><th>Estado</th><th></th></tr></thead>
<tbody id="filas"><tr><td colspan="6" class="vacio">Cargando...</td></tr></tbody></table></div>
<dialog id="dlg"><form id="f" class="cuerpo"><h3 id="titulo"></h3>
<label>Nombre<input name="nombre" required maxlength="100"></label>
<label>N.° de serie<input name="numeroSerie" maxlength="50"></label>
<label>Fecha de adquisición<input name="fechaAdquisicion" type="date"></label>
<label>Estado<select name="estado"><option value="OPERATIVO">Operativo</option><option value="MANTENIMIENTO">Mantenimiento</option><option value="FUERA_DE_SERVICIO">Fuera de servicio</option></select></label>
<label>Área<select name="areaGimnasioId" required></select></label>
<div class="acc-form"><button type="button" class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn">Guardar</button></div></form></dialog>
</main></div></div>
<script src="js/api.js"></script><script src="js/layout.js"></script><script src="js/equipamiento.js"></script></body></html>
